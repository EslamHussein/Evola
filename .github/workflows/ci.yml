name: CI
on:
  push:
  pull_request:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK platform & build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      # Serverless (local-first) architecture: no backend to build/test and no Postgres service —
      # everything runs on-device now. iOS targets need a macOS runner and aren't verified here yet
      # (deferred until Android-first product work catches up — see docs/ROADMAP.md).
      - name: Compile :shared (jvm) + :composeApp (android)
        run: ./gradlew :shared:compileKotlinJvm :composeApp:compileDebugKotlinAndroid --console=plain

      - name: Run :shared tests
        run: ./gradlew :shared:jvmTest --console=plain
